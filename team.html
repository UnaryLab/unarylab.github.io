<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team — Unary Lab</title>
  <meta name="description" content="Members and alumni of Unary Lab (Di Wu, UCF ECE).">
  <link rel="icon" href="file/logo/unary-logo-black.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>

<div id="nav-placeholder"></div>

<main>
  <div class="container">
    <div id="team-root">
      <p class="placeholder-msg">Loading…</p>
    </div>
  </div>
</main>

<script src="js/utils.js?v=1"></script>
<script>
function isCurrent(m) { return !m.leave || m.leave.trim() === ''; }

function nameLink(m) {
  return m.link
    ? `<a href="${esc(m.link)}" target="_blank" rel="noopener">${esc(m.title)}</a>`
    : esc(m.title);
}

function renderMemberCard(m, piUniversity) {
  const nameEl = nameLink(m);
  const photo = m._headshot
    ? `<img src="${esc(m._headshot)}" alt="${esc(m.title)}" loading="lazy">`
    : `<div class="member-avatar">${icon('user')}</div>`;
  const showUniversity = m.university && m.university.trim().toLowerCase() !== (piUniversity || '').trim().toLowerCase();
  const university = showUniversity
    ? `<div class="member-university">${esc(m.university)}</div>`
    : '';
  const extras = [
    m.credit     && `<span class="credit">${esc(m.credit)}</span>`,
    m.internship && `Intern: ${esc(m.internship)}`,
  ].filter(Boolean).join(' · ');
  const research = m.research
    ? `<div class="member-research">${esc(m.research)}</div>`
    : '';

  return `
    <div class="team-card">
      ${photo}
      <div class="member-name">${nameEl}</div>
      ${university}
      <div class="member-degree">${esc(m.degree)}${m.join ? ` · ${esc(m.join)}` : ''}</div>
      ${research}
      ${extras ? `<div class="member-info">${extras}</div>` : ''}
    </div>`;
}

function renderAlumniItem(m) {
  const nameEl = nameLink(m);
  const tenure = [m.join, m.leave].filter(Boolean).join('–');
  const degree = [m.degree, m.university].filter(Boolean).map(esc).join(' @ ');
  const parts = [
    tenure       && esc(tenure),
    degree,
    m.internship && `Intern: ${esc(m.internship)}`,
  ].filter(Boolean);
  const details = [
    m.research && esc(m.research),
    m.credit   && `<span class="credit">${esc(m.credit)}</span>`,
  ].filter(Boolean);
  const employmentEl = m.employment
    ? `<span class="alumni-employment">${esc(m.employment)}</span>` : '';

  return `
    <li class="alumni-item">
      <span class="alumni-main">
        <span><span class="alumni-name">${nameEl}</span>${parts.length ? ` — ${parts.join(' · ')}` : ''}</span>
        ${details.length ? `<span class="alumni-detail-line">${details.join(' · ')}</span>` : ''}
      </span>
      ${employmentEl}
    </li>`;
}

document.addEventListener('DOMContentLoaded', async () => {
  try {
    const [rawMembers, manifest, profile] = await Promise.all([
      loadCSV('data/team.csv'),
      loadFileManifest(),
      loadJSON('data/profile.json'),
    ]);
    const piUniversity = profile.university || '';
    const members = rawMembers.map(m => ({
      ...m,
      _headshot: resolveHeadshot(m.title, manifest),
    }));

    const current = members.filter(isCurrent);
    const alumni  = members.filter(m => !isCurrent(m))
      .sort((a, b) => parseInt(b.leave, 10) - parseInt(a.leave, 10));

    const byJoin = (a, b) => parseInt(a.join, 10) - parseInt(b.join, 10);
    const postdocsAndPhd = current.filter(m => {
      const degree = (m.degree || '').toUpperCase();
      return degree === 'POSTDOC' || degree.startsWith('PHD');
    }).sort(byJoin);
    const msbs = current.filter(m => ['MS','BS'].includes((m.degree || '').toUpperCase())).sort(byJoin);

    let html = '';

    if (postdocsAndPhd.length > 0) {
      html += `<div class="team-section">
        <div class="team-section-title">Current Postdocs and PhD Students</div>
        <div class="team-grid">${postdocsAndPhd.map(m => renderMemberCard(m, piUniversity)).join('')}</div>
      </div>`;
    }

    if (msbs.length > 0) {
      html += `<div class="team-section">
        <div class="team-section-title">Current MS and BS Students</div>
        <div class="team-grid">${msbs.map(m => renderMemberCard(m, piUniversity)).join('')}</div>
      </div>`;
    }

    if (alumni.length > 0) {
      html += `<div class="team-section">
        <div class="team-section-title">Alumni</div>
        <ul class="alumni-list">${alumni.map(renderAlumniItem).join('')}</ul>
      </div>`;
    }

    if (html === '') {
      html = placeholder('No team members listed yet.');
    }

    document.getElementById('team-root').innerHTML = `<h1 class="page-title">Team</h1>${html}`;
  } catch (e) {
    document.getElementById('team-root').innerHTML = placeholder('Could not load team data.');
    console.error(e);
  }
});
</script>
</body>
</html>
