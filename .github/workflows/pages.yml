name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate manifest
        run: python3 scripts/generate_manifests.py

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/file_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update manifest [skip ci]"
            git push
          fi

      - name: Stamp version into CSS/JS references
        run: |
          SHA=$(git rev-parse --short HEAD)
          sed -i "s|style\.css?v=[^\"]*|style.css?v=${SHA}|g" *.html
          sed -i "s|utils\.js?v=[^\"]*|utils.js?v=${SHA}|g" *.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
