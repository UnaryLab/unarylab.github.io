<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News — Unary Lab</title>
  <meta name="description" content="Latest news from Unary Lab (Di Wu, UCF ECE).">
  <link rel="icon" href="file/logo/unary-logo-black.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>

<div id="nav-placeholder"></div>

<main>
  <div class="container">
    <div id="news-root">
      <p class="placeholder-msg">Loading…</p>
    </div>
  </div>
</main>

<script src="js/utils.js?v=1"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  try {
    const news = sortDescByDate((await loadCSV('data/news.csv')).filter(n => n.date && n.date.trim()));
    const root = document.getElementById('news-root');
    if (news.length === 0) {
      root.innerHTML = `<h1 class="page-title">News</h1>${placeholder('No news yet.')}`;
    } else {
      root.innerHTML = `<h1 class="page-title">News</h1><ul class="news-list">${news.map(renderNewsItem).join('')}</ul>`;
    }
  } catch (e) {
    document.getElementById('news-root').innerHTML = placeholder('Could not load news.');
    console.error(e);
  }
});
</script>
</body>
</html>
