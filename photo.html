<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo — Unary Lab</title>
  <meta name="description" content="Photos and events from Unary Lab (Di Wu, UCF ECE).">
  <link rel="icon" href="file/logo/unary-logo-black.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>

<div id="nav-placeholder"></div>

<main>
  <div class="container">
    <div id="photo-root">
      <p class="placeholder-msg">Loading…</p>
    </div>
  </div>
</main>

<script src="js/utils.js?v=1"></script>
<script>
function dateToPrefix(str) {
  const d = parseNewsDate(str);
  if (!d) return null;
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}${m}${day}`;
}

function renderEventsTab(entries) {
  if (entries.length === 0)
    return placeholder('No photos yet.');
  return `<ul class="photo-timeline">${entries.map(entry => {
    const dateDisplay = formatFullDate(entry.date);
    const images = entry.files.map(f =>
      `<img src="file/photo/${encodeURIComponent(entry.folder)}/${encodeURIComponent(f)}" alt="${esc(entry.title)}" loading="lazy">`
    ).join('');
    return `
      <li class="photo-entry">
        <div class="photo-entry-date">${dateDisplay}</div>
        <div class="photo-entry-caption">${esc(entry.title)}</div>
        ${images ? `<div class="photo-grid">${images}</div>` : ''}
      </li>`;
  }).join('')}</ul>`;
}

function renderHealingTab(petManifest) {
  if (petManifest.length === 0)
    return placeholder('No pets yet.');
  const sorted = [...petManifest].sort((a, b) => {
    const na = a.folder.split('---')[0].toLowerCase();
    const nb = b.folder.split('---')[0].toLowerCase();
    return na.localeCompare(nb);
  });
  return sorted.map(entry => {
    const dashIdx = entry.folder.indexOf('---');
    const petName   = dashIdx >= 0 ? entry.folder.slice(0, dashIdx) : entry.folder;
    const ownerName = dashIdx >= 0 ? entry.folder.slice(dashIdx + 3) : '';
    const petDisplay = /[A-Z]/.test(petName) ? petName : petName.charAt(0).toUpperCase() + petName.slice(1);
    const images = entry.files.map(f =>
      `<img src="file/pet/${encodeURIComponent(entry.folder)}/${encodeURIComponent(f)}" alt="${esc(petDisplay)}" loading="lazy">`
    ).join('');
    return `
      <div class="team-section">
        <div class="team-section-title">
          ${esc(petDisplay)}${ownerName ? ` <span style="font-weight:400;color:#888;">— ${esc(ownerName)}</span>` : ''}
        </div>
        <div class="photo-grid">${images}</div>
      </div>`;
  }).join('');
}

document.addEventListener('DOMContentLoaded', async () => {
  try {
    const [photos, manifest] = await Promise.all([
      loadCSV('data/photo.csv'),
      loadFileManifest(),
    ]);
    const photoManifest = manifest.photo || [];
    const petManifest = manifest.pet || [];

    const folderMap = {};
    photoManifest.forEach(m => { folderMap[m.folder.slice(0, 8)] = m; });

    const entries = sortDescByDate(photos.map(p => {
      const prefix = dateToPrefix(p.date);
      const m = prefix ? folderMap[prefix] : null;
      return { ...p, folder: m ? m.folder : null, files: m ? m.files : [] };
    }));

    setupTabs(document.getElementById('photo-root'), [
      { id: 'events',  label: 'Events',          html: renderEventsTab(entries) },
      { id: 'healing', label: 'Healing the Day', html: renderHealingTab(petManifest) },
    ], 'events');
  } catch (e) {
    document.getElementById('photo-root').innerHTML = placeholder('Could not load photos.');
    console.error(e);
  }
});
</script>
</body>
</html>
