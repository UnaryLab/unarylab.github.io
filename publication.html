<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publication — Unary Lab</title>
  <meta name="description" content="Publications from Unary Lab (Di Wu, UCF ECE).">
  <link rel="icon" href="file/logo/unary-logo-black.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>

<div id="nav-placeholder"></div>

<main>
  <div class="container">
    <div id="pub-root">
      <p class="placeholder-msg">Loading…</p>
    </div>
  </div>
</main>

<script src="js/utils.js?v=1"></script>
<script>
function groupByYear(pubs) {
  const map = {};
  pubs.forEach(p => {
    const d = parseNewsDate(p.date);
    const yr = d ? d.getFullYear().toString() : 'Unknown';
    (map[yr] = map[yr] || []).push(p);
  });
  return map;
}

function renderGrouped(pubs) {
  if (pubs.length === 0) return placeholder('No publications.');
  const grouped = groupByYear(sortDescByDate(pubs));
  const years = Object.keys(grouped).sort((a, b) => b - a);
  return years.map(yr => `
    <div class="year-header">${esc(yr)}</div>
    <ul class="pub-list">${grouped[yr].map(renderPubItem).join('')}</ul>
  `).join('');
}

document.addEventListener('DOMContentLoaded', async () => {
  try {
    const [rawPubs, manifest] = await Promise.all([
      loadCSV('data/publication.csv'),
      loadFileManifest(),
    ]);
    const allPubs = rawPubs.map(p => ({ ...p, ...resolvePubLinks(p['paper/slide/poster'], manifest) }));
    const selectedPubs = allPubs.filter(p =>
      ['1','true','yes'].includes((p.selected || '').toLowerCase().trim())
    );

    setupTabs(document.getElementById('pub-root'), [
      { id: 'selected', label: 'Selected Publications', html: () => renderGrouped(selectedPubs) },
      { id: 'full',     label: 'Full Publications',     html: () => renderGrouped(allPubs) },
    ], 'selected');
  } catch (e) {
    document.getElementById('pub-root').innerHTML = placeholder('Could not load publications.');
    console.error(e);
  }
});
</script>
</body>
</html>
